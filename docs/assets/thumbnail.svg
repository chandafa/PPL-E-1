    <rect x="1104" y="104" width="62" height="40" rx="10" fill="url(#accent)"/>
    <text x="1135" y="132" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="21" font-weight="800" fill="#0f172a">PDF</text>

    <g fill="#e2e8f0">
      <rect x="822" y="200" width="250" height="14" rx="7"/>
      <rect x="822" y="228" width="330" height="12" rx="6"/>
      <rect x="822" y="254" width="290" height="12" rx="6"/>
      <rect x="822" y="298" width="336" height="1.5"/>
    </g>
    <g font-family="'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="19" fill="#475569">
      <text x="822" y="338">DPP</text>
      <text x="1158" y="338" text-anchor="end" font-weight="700" fill="#0f172a">100.000.000,00</text>
      <text x="822" y="374">PPN 11%</text>
      <text x="1158" y="374" text-anchor="end" font-weight="700" fill="#0f172a">11.000.000,00</text>
    </g>
    <rect x="822" y="398" width="336" height="1.5" fill="#e2e8f0"/>

    <!-- batang rekap -->
    <g>
      <rect x="826" y="470" width="34" height="62" rx="7" fill="url(#bar)" opacity="0.55"/>
      <rect x="872" y="446" width="34" height="86" rx="7" fill="url(#bar)" opacity="0.75"/>
      <rect x="918" y="420" width="34" height="112" rx="7" fill="url(#bar)"/>
      <text x="826" y="560" font-family="'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="15" fill="#64748b">Rekap bulanan</text>
    </g>

