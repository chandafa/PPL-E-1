    <text x="299" y="97" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.2" fill="#6ee7b7">KELAS E · KELOMPOK 1 · MODUL E-1</text>

    <text x="80" y="204" font-family="'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="86" font-weight="800" fill="#ffffff">E-1 Pajak Proyek</text>
    <text x="80" y="288" font-family="'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="86" font-weight="800" fill="url(#accent)">REST API</text>

    <text x="80" y="344" font-family="'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="31" fill="#e2e8f0">Pencatatan e-Faktur dan pajak proyek</text>
    <text x="80" y="384" font-family="'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="22" fill="#94a3b8">ERP PT Anaheim Nimbus Universal</text>
