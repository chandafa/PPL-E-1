  </g>
  
  <g>
    <rect x="244" y="404" width="130" height="46" rx="23" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.28)"/>
    <text x="309" y="434" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="22" font-weight="600" fill="#e2e8f0">PHP 8.4</text>
  </g>
  
  <g>
    <rect x="388" y="404" width="170" height="46" rx="23" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.28)"/>
    <text x="473" y="434" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="22" font-weight="600" fill="#e2e8f0">PostgreSQL</text>
  </g>
  
  <g>
    <rect x="572" y="404" width="170" height="46" rx="23" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.28)"/>
    <text x="657" y="434" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="22" font-weight="600" fill="#e2e8f0">OpenAPI 3.1</text>
  </g>

  
  <g>
    <text x="80" y="548" font-family="'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="54" font-weight="800" fill="url(#accent)">11</text>
    <text x="80" y="582" font-family="'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="21" fill="#cbd5e1">operasi API</text>
  </g>
  
  <g>
    <text x="290" y="548" font-family="'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="54" font-weight="800" fill="url(#accent)">100</text>
    <text x="290" y="582" font-family="'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="21" fill="#cbd5e1">uji otomatis lulus</text>
  </g>
  
  <g>
    <text x="560" y="548" font-family="'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="54" font-weight="800" fill="url(#accent)">2</text>
    <text x="560" y="582" font-family="'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="21" fill="#cbd5e1">format ekspor</text>
  </g>

