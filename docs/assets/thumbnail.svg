    <g transform="rotate(-7 1060 486)">
      <rect x="964" y="440" width="210" height="92" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="4"/>
      <circle cx="1002" cy="486" r="19" fill="#10b981"/>
      <path d="M992 486 l8 9 l16 -18" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1030" y="481" font-family="'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="15" font-weight="800" fill="#047857">TERKONFIRMASI</text>
      <text x="1030" y="504" font-family="'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="13" fill="#059669">NTPN + bukti bayar</text>
