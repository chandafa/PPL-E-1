services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: e1_app
      POSTGRES_PASSWORD: e1_dev_pass
      POSTGRES_DB: e1_pajak
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e1_app -d e1_pajak"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: e1_pajak
      DB_USERNAME: e1_app
      DB_PASSWORD: e1_dev_pass
      F1_JWT_SECRET: ganti-dengan-rahasia-bersama-minimal-32-karakter-dari-f1
    ports:
      - "8080:8080"
    volumes:
      - storagedata:/app/storage/app

volumes:
  pgdata:
  storagedata:
