openapi: "3.1.0"
info:
  title: E-1 Pencatatan e-Faktur dan pajak proyek
  version: "0.2.0"
  contact:
    name: "Kelompok 1 / Kelas E (E-1): Pencatatan e-Faktur dan pajak proyek"
  description: "Kontrak E-1 dengan aturan rekap Rancangan Antarmuka v0.2: NORMAL dan REPLACEMENT keluaran yang masih aktif dihitung; CANCELLED dan faktur asal terganti tidak dihitung. Aturan ini menggantikan pengecualian REPLACEMENT pada audit 2026-10-16 sesuai keputusan implementasi UI. Nominal JSON string decimal tanpa pemisah ribuan. type/vendorName merupakan field tambahan skema data yang didokumentasikan; belum membuka API faktur masukan. Kesepakatan lintas kelompok tetap menunggu review. Kontrak API modul pencatatan e-Faktur dan pajak proyek, Kelompok 1 / Kelas E. Memuat 11 operasi API-KE01-01 sampai API-KE01-11; satu operasi (API-KE01-10) dibaca modul lain termasuk E-2, sisanya dipakai antarmuka web E-1. Rujukan: Daftar Kontrak API (04), Spesifikasi Fitur Minimum (01), Rancangan Antarmuka (02), Skema Data Awal (03). Path, field, enum, dan kode kesalahan berstatus usulan sampai ditinjau kelompok konsumen. Kesalahan umum di luar daftar per operasi memakai bentuk Error yang sama: 404 NOT_FOUND (rute tidak dikenal), 405 METHOD_NOT_ALLOWED, 413 PAYLOAD_TOO_LARGE, 500 INTERNAL_ERROR."
servers:
  - url: /
    description: Lingkungan uji lokal Laravel (composer serve)
security:
  - bearerAuth: []
tags:
  - name: Faktur dan pembayaran
    description: "Operasi antarmuka web E-1 (internal): faktur, riwayat, rekap, pembayaran, ekspor."
  - name: Ringkasan pajak
    description: Data agregat pajak per masa pajak untuk modul lain; tanpa dokumen, rincian faktur, atau lampiran.
paths:
  /api/v1/tax-invoices/extractions:
    post:
      operationId: extractTaxInvoice
      tags:
        - Faktur dan pembayaran
      summary: "API-KE01-01: Pratinjau hasil ekstraksi PDF e-Faktur"
      description: "Fitur FTR-KE01-01; dipakai UI-KE01-02 (internal). Hasil ekstraksi PDF e-Faktur untuk invoice D-2 yang dipilih ditampilkan sebagai pratinjau sebelum faktur disimpan; tidak menyimpan data. Sumber: Backlog BL-01; Peta Aktor dan Proses E-1 (Langkah 2–3); jawaban mitra Q-02 dan Q-04."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - invoiceId
                - eFakturFile
              properties:
                invoiceId:
                  type: string
                  minLength: 1
                  examples:
                    - inv-demo-001
                  description: invoiceId D-2 yang belum memiliki faktur aktif (Q-04), dikirim sebagai field teks; contoh inv-demo-001.
                eFakturFile:
                  type: string
                  format: binary
                  contentMediaType: application/pdf
                  description: Berkas PDF e-Faktur yang dibuat di luar sistem (multipart/form-data); maksimum 5 MiB per berkas.
            encoding:
              eFakturFile:
                contentType: application/pdf
      responses:
        "200":
          description: Hasil ekstraksi (belum tersimpan)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractionResultResponse"
              examples:
                sukses:
                  value:
                    code: "200"
                    message: "Hasil ekstraksi (belum tersimpan)"
                    data:
                      invoiceId: inv-demo-001
                      taxInvoiceNumber: "010.000-26.12345678"
                      taxInvoiceDate: "2026-11-01"
                      taxPeriod: "2026-11"
                      dpp: "100000000.00"
                      ppn: "11000000.00"
                      ppnbm: "0.00"
                      items:
                        - itemCode: JASA-001
                          itemName: Jasa pengembangan perangkat lunak termin 1
                          saleReplacementAdvanceTermAmount: "100000000.00"
                          discountAmount: "0.00"
                          receivedAdvanceAmount: "0.00"
        "400":
          description: "Permintaan tidak valid: berkas bukan PDF; struktur PDF tidak sesuai standar sehingga ekstraksi gagal (tidak dibuat catatan faktur parsial); invoiceId kosong"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                INVALID_FILE:
                  summary: berkas bukan PDF
                  value:
                    code: "400"
                    message: "Berkas harus berformat PDF"
                    data: null
                    errorCode: INVALID_FILE
                EXTRACTION_FAILED:
                  summary: struktur PDF tidak sesuai standar sehingga ekstraksi gagal (tidak dibuat catatan faktur parsial)
                  value:
                    code: "400"
                    message: "PDF e-Faktur tidak dapat diproses"
                    data: null
                    errorCode: EXTRACTION_FAILED
                INVALID_INVOICE_ID:
                  summary: invoiceId tidak dikirim atau kosong
                  value:
                    code: "400"
                    message: "invoiceId wajib diisi"
                    data: null
                    errorCode: INVALID_INVOICE_ID
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "ID tidak ditemukan: invoiceId tidak dikenal D-2"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                INVOICE_NOT_FOUND:
                  summary: invoiceId tidak dikenal D-2
                  value:
                    code: "404"
                    message: "Invoice tidak ditemukan"
                    data: null
                    errorCode: INVOICE_NOT_FOUND
        "409":
          description: "Konflik status atau data: invoice sudah memiliki faktur aktif (1 invoice : 1 faktur, Q-04); NSFP pada PDF sudah terdaftar"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                INVOICE_ALREADY_HAS_ACTIVE_TAX_INVOICE:
                  summary: "invoice sudah memiliki faktur aktif (1 invoice : 1 faktur, Q-04)"
                  value:
                    code: "409"
                    message: "Invoice ini sudah memiliki faktur aktif"
                    data: null
                    errorCode: INVOICE_ALREADY_HAS_ACTIVE_TAX_INVOICE
                DUPLICATE_NSFP:
                  summary: NSFP pada PDF sudah terdaftar
                  value:
                    code: "409"
                    message: "NSFP sudah terdaftar"
                    data: null
                    errorCode: DUPLICATE_NSFP
        "503":
          description: Layanan D-2 tidak dapat dihubungi sehingga invoiceId tidak dapat divalidasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                D2_UNAVAILABLE:
                  summary: API D-2 tidak tersedia (hanya bila D2_DRIVER=http)
                  value:
                    code: "503"
                    message: "Layanan D-2 tidak dapat dihubungi"
                    data: null
                    errorCode: D2_UNAVAILABLE
  /api/v1/tax-invoices/outgoing:
    post:
      operationId: createOutgoingTaxInvoice
      tags:
        - Faktur dan pembayaran
      summary: "API-KE01-02: Simpan faktur keluaran atau faktur pengganti"
      description: "Fitur FTR-KE01-01, FTR-KE01-03; dipakai UI-KE01-02, UI-KE01-03 (internal). Faktur Pajak Keluaran tersimpan dan tertaut ke invoice D-2 dari PDF e-Faktur, atau faktur pengganti yang wajib menunjuk faktur asalnya. Sumber: Backlog BL-01, BL-02; Peta Aktor dan Proses E-1 (Langkah 2–5); jawaban mitra Q-02, Q-04, Q-07."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - invoiceId
                - eFakturFile
              properties:
                invoiceId:
                  type: string
                  minLength: 1
                  examples:
                    - inv-demo-001
                  description: invoiceId D-2 (contoh inv-demo-001), dikirim sebagai field teks; untuk faktur pengganti sama dengan invoiceId faktur asal.
                eFakturFile:
                  type: string
                  format: binary
                  contentMediaType: application/pdf
                  description: PDF e-Faktur yang sama dengan pratinjau API-KE01-01 (multipart/form-data).
                replacesTaxInvoiceId:
                  type: string
                  format: uuid
                  examples:
                    - "01a18abf-fb80-72f6-bb81-c9d0a347e5b2"
                  description: "Hanya untuk faktur pengganti: ID faktur asal (contoh 01a18abf-fb80-72f6-bb81-c9d0a347e5b2), yang lalu menjadi non-aktif/terganti. Bila diisi, status faktur baru REPLACEMENT."
            encoding:
              eFakturFile:
                contentType: application/pdf
      responses:
        "200":
          description: Faktur tersimpan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxInvoiceCreatedResponse"
              examples:
                sukses:
                  value:
                    code: "200"
                    message: "Faktur tersimpan"
                    data:
                      taxInvoiceId: "01a1950c-b380-73a9-91c4-7e20d5b86f14"
                      type: OUTGOING
                      invoiceId: inv-demo-001
                      vendorName: null
                      status: NORMAL
                      replacesTaxInvoiceId: null
                      taxInvoiceNumber: "010.000-26.12345678"
                      taxInvoiceDate: "2026-11-01"
                      taxPeriod: "2026-11"
                      dpp: "100000000.00"
                      ppn: "11000000.00"
                      ppnbm: "0.00"
                      items:
                        - itemCode: JASA-001
                          itemName: Jasa pengembangan perangkat lunak termin 1
                          saleReplacementAdvanceTermAmount: "100000000.00"
                          discountAmount: "0.00"
                          receivedAdvanceAmount: "0.00"
                      createdByAkunId: AKN-0002
                      createdAt: "2026-11-01T03:00:00Z"
        "400":
          description: "Permintaan tidak valid: berkas bukan PDF; struktur PDF tidak sesuai standar sehingga ekstraksi gagal (tidak dibuat catatan faktur parsial); invoiceId faktur pengganti berbeda dari faktur asal; invoiceId kosong"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                INVALID_FILE:
                  summary: berkas bukan PDF
                  value:
                    code: "400"
                    message: "Berkas harus berformat PDF"
                    data: null
                    errorCode: INVALID_FILE
                EXTRACTION_FAILED:
                  summary: struktur PDF tidak sesuai standar sehingga ekstraksi gagal (tidak dibuat catatan faktur parsial)
                  value:
                    code: "400"
                    message: "PDF e-Faktur tidak dapat diproses"
                    data: null
                    errorCode: EXTRACTION_FAILED
                REPLACEMENT_INVOICE_MISMATCH:
                  summary: invoiceId faktur pengganti berbeda dari faktur asal
                  value:
                    code: "400"
                    message: "invoiceId faktur pengganti harus sama dengan faktur asal"
                    data: null
                    errorCode: REPLACEMENT_INVOICE_MISMATCH
                INVALID_INVOICE_ID:
                  summary: invoiceId tidak dikirim atau kosong
                  value:
                    code: "400"
                    message: "invoiceId wajib diisi"
                    data: null
                    errorCode: INVALID_INVOICE_ID
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "ID tidak ditemukan: invoiceId tidak dikenal D-2; replacesTaxInvoiceId tidak dikenal"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                INVOICE_NOT_FOUND:
                  summary: invoiceId tidak dikenal D-2
                  value:
                    code: "404"
                    message: "Invoice tidak ditemukan"
                    data: null
                    errorCode: INVOICE_NOT_FOUND
                TAX_INVOICE_NOT_FOUND:
                  summary: replacesTaxInvoiceId tidak dikenal
                  value:
                    code: "404"
                    message: "Faktur asal tidak ditemukan"
                    data: null
                    errorCode: TAX_INVOICE_NOT_FOUND
        "409":
          description: "Konflik status atau data: invoice sudah memiliki faktur aktif (bukan faktur pengganti); NSFP pada PDF sudah terdaftar; faktur asal yang akan diganti sudah Dibatalkan atau sudah diganti faktur lain"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                INVOICE_ALREADY_HAS_ACTIVE_TAX_INVOICE:
                  summary: invoice sudah memiliki faktur aktif (bukan faktur pengganti)
                  value:
                    code: "409"
                    message: "Invoice ini sudah memiliki faktur aktif"
                    data: null
                    errorCode: INVOICE_ALREADY_HAS_ACTIVE_TAX_INVOICE
                DUPLICATE_NSFP:
                  summary: NSFP pada PDF sudah terdaftar
                  value:
                    code: "409"
                    message: "NSFP sudah terdaftar"
                    data: null
                    errorCode: DUPLICATE_NSFP
                TAX_INVOICE_ALREADY_CANCELLED:
                  summary: faktur asal (replacesTaxInvoiceId) sudah Dibatalkan
                  value:
                    code: "409"
                    message: "Faktur asal sudah berstatus Dibatalkan"
                    data: null
                    errorCode: TAX_INVOICE_ALREADY_CANCELLED
        "503":
          description: Layanan D-2 tidak dapat dihubungi sehingga invoiceId tidak dapat divalidasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                D2_UNAVAILABLE:
                  summary: API D-2 tidak tersedia (hanya bila D2_DRIVER=http)
                  value:
                    code: "503"
                    message: "Layanan D-2 tidak dapat dihubungi"
                    data: null
                    errorCode: D2_UNAVAILABLE
  /api/v1/tax-invoices:
    get:
      operationId: listTaxInvoices
      tags:
        - Faktur dan pembayaran
      summary: "API-KE01-03: Cari dan filter faktur"
      description: "Fitur FTR-KE01-02; dipakai UI-KE01-01 (internal). Daftar faktur dicari dan difilter berdasarkan nomor faktur/NSFP, proyek, klien, masa pajak, dan status. Sumber: Backlog BL-04; Peta Aktor dan Proses E-1 (Langkah 6); jawaban mitra Q-16."
      parameters:
        - name: taxInvoiceNumber
          in: query
          required: false
          description: Nomor faktur/NSFP; contoh 010.000-26.12345678.
          schema:
            type: string
            examples:
              - "010.000-26.12345678"
        - name: project
          in: query
          required: false
          description: ID atau nama proyek (referensi dari invoice D-2); contoh prj-demo-001.
          schema:
            type: string
            examples:
              - prj-demo-001
        - name: client
          in: query
          required: false
          description: ID atau nama klien (referensi dari invoice D-2).
          schema:
            type: string
        - name: taxPeriod
          in: query
          required: false
          description: Masa pajak; contoh 2026-11.
          schema:
            $ref: "#/components/schemas/TaxPeriod"
        - name: status
          in: query
          required: false
          description: NORMAL, REPLACEMENT, atau CANCELLED (label UI Normal, Pengganti, Dibatalkan).
          schema:
            $ref: "#/components/schemas/TaxInvoiceStatus"
        - name: page
          in: query
          required: false
          description: Halaman hasil, mulai 1 (default 1).
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: Ukuran halaman; default 20, maksimum 100 (usulan, 04 menyerahkannya ke OpenAPI).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Daftar faktur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxInvoiceListResponse"
              examples:
                sukses:
                  value:
                    code: "200"
                    message: "Daftar faktur"
                    data:
                      items:
                        - taxInvoiceId: "01a1950c-b380-73a9-91c4-7e20d5b86f14"
                          type: OUTGOING
                          taxInvoiceNumber: "010.000-26.12345678"
                          taxInvoiceDate: "2026-11-01"
                          invoiceId: inv-demo-001
                          vendorName: null
                          projectId: prj-demo-001
                          clientId: null
                          taxPeriod: "2026-11"
                          dpp: "100000000.00"
                          ppn: "11000000.00"
                          status: NORMAL
                          replacedByTaxInvoiceId: null
                      pagination:
                        page: 1
                        pageSize: 20
                        totalItems: 1
        "400":
          description: "Permintaan tidak valid: taxPeriod bukan YYYY-MM atau status di luar enum"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                INVALID_FILTER:
                  summary: taxPeriod bukan YYYY-MM atau status di luar enum
                  value:
                    code: "400"
                    message: "Filter tidak valid: taxPeriod harus berformat YYYY-MM"
                    data: null
                    errorCode: INVALID_FILTER
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/tax-invoices/{taxInvoiceId}:
    get:
      operationId: getTaxInvoice
      tags:
        - Faktur dan pembayaran
      summary: "API-KE01-04: Detail faktur beserta item dan tautan asal/pengganti"
      description: "Fitur FTR-KE01-02; dipakai UI-KE01-03 (internal). Detail satu faktur beserta item, status, dan tautan faktur asal/pengganti ditampilkan, termasuk detail yang dibuka dari rekap. Sumber: Backlog BL-04; Peta Aktor dan Proses E-1 (Langkah 6); jawaban mitra Q-03, Q-07, Q-16."
      parameters:
        - name: taxInvoiceId
          in: path
          required: true
          description: ID faktur; contoh 01a1950c-b380-73a9-91c4-7e20d5b86f14.
          schema:
            type: string
            format: uuid
            examples:
              - "01a1950c-b380-73a9-91c4-7e20d5b86f14"
      responses:
        "200":
          description: Detail faktur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxInvoiceDetailResponse"
              examples:
                sukses:
                  value:
                    code: "200"
                    message: "Detail faktur"
                    data:
                      taxInvoice:
                        taxInvoiceId: "01a1950c-b380-73a9-91c4-7e20d5b86f14"
                        type: OUTGOING
                        invoiceId: inv-demo-001
                        vendorName: null
                        projectId: prj-demo-001
                        clientId: null
                        taxInvoiceNumber: "010.000-26.12345678"
                        taxInvoiceDate: "2026-11-01"
                        taxPeriod: "2026-11"
                        dpp: "100000000.00"
                        ppn: "11000000.00"
                        ppnbm: "0.00"
                        status: NORMAL
                        pdfUri: /files/tax/efaktur-001.pdf
                        createdByAkunId: AKN-0002
                        createdAt: "2026-11-01T03:00:00Z"
                        updatedAt: "2026-11-01T03:00:00Z"
                      items:
                        - itemCode: JASA-001
                          itemName: Jasa pengembangan perangkat lunak termin 1
                          saleReplacementAdvanceTermAmount: "100000000.00"
                          discountAmount: "0.00"
                          receivedAdvanceAmount: "0.00"
                      replacesTaxInvoiceId: null
                      replacedByTaxInvoiceId: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "ID tidak ditemukan: taxInvoiceId tidak dikenal"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                TAX_INVOICE_NOT_FOUND:
                  summary: taxInvoiceId tidak dikenal
                  value:
                    code: "404"
                    message: "Faktur pajak tidak ditemukan"
                    data: null
                    errorCode: TAX_INVOICE_NOT_FOUND
    patch:
      operationId: updateTaxInvoice
      tags:
        - Faktur dan pembayaran
      summary: "API-KE01-05: Koreksi atau batalkan faktur dengan riwayat"
      description: "Fitur FTR-KE01-03; dipakai UI-KE01-03 (internal). Data faktur hasil ekstraksi dikoreksi atau faktur dibatalkan (status CANCELLED) tanpa menghilangkan riwayat lama. Sumber: Backlog BL-02, BL-03; Peta Aktor dan Proses E-1 (Langkah 4–5); jawaban mitra Q-05, Q-06, Q-07."
      parameters:
        - name: taxInvoiceId
          in: path
          required: true
          description: ID faktur; contoh 01a1950c-b380-73a9-91c4-7e20d5b86f14.
          schema:
            type: string
            format: uuid
            examples:
              - "01a1950c-b380-73a9-91c4-7e20d5b86f14"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - changes
              properties:
                changes:
                  $ref: "#/components/schemas/TaxInvoiceChanges"
                  description: "Field yang boleh dikoreksi: taxInvoiceNumber, taxInvoiceDate, taxPeriod, dpp, ppn, ppnbm, items; atau status CANCELLED untuk pembatalan. invoiceId dan nilai invoice D-2 tidak dapat diubah."
                note:
                  type: string
                  examples:
                    - Koreksi tanggal faktur
                  description: Alasan koreksi atau pembatalan; disimpan sebagai note di ENT-KE01-05.
            examples:
              contoh:
                value:
                  changes:
                    taxInvoiceDate: "2026-11-01"
                  note: Koreksi tanggal faktur
      responses:
        "200":
          description: Faktur diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxInvoiceUpdatedResponse"
              examples:
                sukses:
                  value:
                    code: "200"
                    message: "Faktur diperbarui"
                    data:
                      taxInvoice:
                        taxInvoiceId: "01a1950c-b380-73a9-91c4-7e20d5b86f14"
                        type: OUTGOING
                        invoiceId: inv-demo-001
                        vendorName: null
                        projectId: prj-demo-001
                        clientId: null
                        taxInvoiceNumber: "010.000-26.12345678"
                        taxInvoiceDate: "2026-11-01"
                        taxPeriod: "2026-11"
                        dpp: "100000000.00"
                        ppn: "11000000.00"
                        ppnbm: "0.00"
                        status: NORMAL
                        pdfUri: /files/tax/efaktur-001.pdf
                        createdByAkunId: AKN-0002
                        createdAt: "2026-11-01T03:00:00Z"
                        updatedAt: "2026-11-01T03:05:00Z"
                      auditId: "01a19511-4760-70e7-bb5c-92a4f1d63b80"
        "400":
          description: "Permintaan tidak valid: field di luar yang diizinkan atau nilai tidak valid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                INVALID_CHANGE:
                  summary: field di luar yang diizinkan atau nilai tidak valid
                  value:
                    code: "400"
                    message: "Field tidak boleh diubah atau nilai tidak valid"
                    data: null
                    errorCode: INVALID_CHANGE
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "ID tidak ditemukan: taxInvoiceId tidak dikenal"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                TAX_INVOICE_NOT_FOUND:
                  summary: taxInvoiceId tidak dikenal
                  value:
                    code: "404"
                    message: "Faktur pajak tidak ditemukan"
                    data: null
                    errorCode: TAX_INVOICE_NOT_FOUND
        "409":
          description: "Konflik status atau data: faktur sudah Dibatalkan sehingga tidak dapat diubah lagi; taxInvoiceNumber hasil koreksi sudah terdaftar pada faktur lain"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                TAX_INVOICE_ALREADY_CANCELLED:
                  summary: faktur sudah Dibatalkan sehingga tidak dapat diubah lagi
                  value:
                    code: "409"
                    message: "Faktur sudah berstatus Dibatalkan"
                    data: null
                    errorCode: TAX_INVOICE_ALREADY_CANCELLED
                DUPLICATE_NSFP:
                  summary: taxInvoiceNumber hasil koreksi sudah terdaftar pada faktur lain
                  value:
                    code: "409"
                    message: "NSFP sudah terdaftar"
                    data: null
                    errorCode: DUPLICATE_NSFP
  /api/v1/tax-invoices/{taxInvoiceId}/history:
    get:
      operationId: getTaxInvoiceHistory
      tags:
        - Faktur dan pembayaran
      summary: "API-KE01-06: Riwayat perubahan faktur"
      description: "Fitur FTR-KE01-03; dipakai UI-KE01-03 (internal). Riwayat perubahan faktur ditampilkan secara kronologis (waktu, pengguna, aksi, nilai sebelum dan sesudah). Sumber: Backlog BL-02, BL-03; Peta Aktor dan Proses E-1 (Langkah 4–5); jawaban mitra Q-05, Q-06, Q-07."
      parameters:
        - name: taxInvoiceId
          in: path
          required: true
          description: ID faktur; contoh 01a1950c-b380-73a9-91c4-7e20d5b86f14.
          schema:
            type: string
            format: uuid
            examples:
              - "01a1950c-b380-73a9-91c4-7e20d5b86f14"
      responses:
        "200":
          description: Riwayat faktur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxInvoiceHistoryResponse"
              examples:
                sukses:
                  value:
                    code: "200"
                    message: "Riwayat faktur"
                    data:
                      history:
                        - auditId: "01a1950c-b380-74c1-88d2-7a05e9b3f671"
                          action: CREATE
                          actorAkunId: AKN-0002
                          changedAt: "2026-11-01T03:00:00Z"
                          beforeSnapshot: null
                          afterSnapshot:
                            taxInvoiceNumber: "010.000-26.12345678"
                            taxInvoiceDate: "2026-11-10"
                            taxPeriod: "2026-11"
                            dpp: "100000000.00"
                            ppn: "11000000.00"
                            ppnbm: "0.00"
                            status: NORMAL
                          note: null
                        - auditId: "01a19511-4760-70e7-bb5c-92a4f1d63b80"
                          action: UPDATE
                          actorAkunId: AKN-0002
                          changedAt: "2026-11-01T03:05:00Z"
                          beforeSnapshot:
                            taxInvoiceDate: "2026-11-10"
                          afterSnapshot:
                            taxInvoiceDate: "2026-11-01"
                          note: Koreksi tanggal faktur
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "ID tidak ditemukan: taxInvoiceId tidak dikenal"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                TAX_INVOICE_NOT_FOUND:
                  summary: taxInvoiceId tidak dikenal
                  value:
                    code: "404"
                    message: "Faktur pajak tidak ditemukan"
                    data: null
                    errorCode: TAX_INVOICE_NOT_FOUND
  /api/v1/tax-recaps/{taxPeriod}:
    get:
      operationId: getTaxRecap
      tags:
        - Faktur dan pembayaran
      summary: "API-KE01-07: Rekap pajak per masa pajak"
      description: "Fitur FTR-KE01-04; dipakai UI-KE01-04 (internal). Rekap per masa pajak bulanan ditampilkan: ringkasan faktur NORMAL dan REPLACEMENT keluaran yang belum terganti, daftar seluruh faktur periode, dan pembayaran. Aturan angka mengikuti Rancangan Antarmuka v0.2."
      parameters:
