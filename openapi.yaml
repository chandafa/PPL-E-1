    Error:
      type: object
      description: Respons gagal dengan status HTTP, pesan, data null, dan kode alasan khusus.
      required:
        - code
        - message
        - data
        - errorCode
      properties:
        code:
          type: string
          pattern: ^[45][0-9]{2}$
          examples:
            - "400"
            - "404"
            - "409"
          description: Status HTTP dalam bentuk string; harus sama dengan status respons.
        message:
          type: string
          description: Pesan kesalahan yang dapat dibaca.
        data:
          type: "null"
          description: Tidak ada data saat gagal.
        errorCode:
          type: string
          description: Kode alasan khusus agar klien dapat membedakan kesalahan dengan status HTTP yang sama.
          enum:
            - INVALID_FILE
            - EXTRACTION_FAILED
            - UNAUTHORIZED
            - FORBIDDEN
            - INVOICE_NOT_FOUND
            - INVOICE_ALREADY_HAS_ACTIVE_TAX_INVOICE
            - DUPLICATE_NSFP
            - REPLACEMENT_INVOICE_MISMATCH
            - TAX_INVOICE_NOT_FOUND
            - INVALID_FILTER
            - INVALID_CHANGE
            - TAX_INVOICE_ALREADY_CANCELLED
            - INVALID_TAX_PERIOD
            - INVALID_PAYMENT
            - TAX_RECAP_NOT_FOUND
            - INVALID_FORMAT
            - INVALID_PROJECT_ID
            - TAX_PAYMENT_NOT_FOUND
            - INVALID_INVOICE_ID
            - D2_UNAVAILABLE
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - PAYLOAD_TOO_LARGE
            - TOO_MANY_REQUESTS
            - VALIDATION_ERROR
            - HTTP_ERROR
            - INTERNAL_ERROR
    TaxInvoiceType:
      type: string
      enum:
        - OUTGOING
        - INCOMING
      description: Jenis faktur. API E-1 hanya mencatat OUTGOING (faktur keluaran); INCOMING dicadangkan sesuai Skema Data Awal (ENT-KE01-01) sampai faktur masukan diputuskan (Q-08, Q-20).
