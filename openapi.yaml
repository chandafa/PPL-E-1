          $ref: "#/components/schemas/Money"
          description: Jumlah setor pada masa pajak; 0,00 bila belum ada pembayaran.
        paymentDifference:
          $ref: "#/components/schemas/SignedMoney"
          description: amountPaid dikurangi totalPpn; negatif bila jumlah setor kurang dari total PPN.
        paymentStatus:
          $ref: "#/components/schemas/RecapPaymentStatus"
        computedAt:
          type: string
          format: date-time
          description: Waktu rekap terakhir dihitung.
