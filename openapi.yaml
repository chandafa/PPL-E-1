  /api/v1/tax-payments:
    post:
      operationId: createTaxPayment
      tags:
        - Faktur dan pembayaran
      summary: "API-KE01-08: Catat pembayaran dan pelaporan pajak"
      description: "Fitur FTR-KE01-05; dipakai UI-KE01-05 (internal). Pembayaran dan pelaporan pajak untuk masa pajak yang dibuka dari rekap tercatat: jumlah setor, masa dan tahun pajak, kode billing, NTPN, e-Billing, dan bukti pembayaran. Sumber: Backlog BL-06; Peta Aktor dan Proses E-1 (Langkah 8); jawaban mitra Q-02, Q-09, Q-10."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - taxPeriod
                - taxYear
                - amountPaid
                - billingId
                - eBillingFile
              properties:
                taxPeriod:
                  $ref: "#/components/schemas/TaxPeriod"
                  description: Masa pajak dari rekap yang dibuka; contoh 2026-11.
                taxYear:
                  type: integer
                  examples:
                    - 2026
                  description: Tahun pajak (Q-02), terisi dari masa pajak; contoh 2026.
                amountPaid:
                  $ref: "#/components/schemas/MoneyInput"
                  description: Jumlah setor; tidak boleh negatif; contoh 11000000.00.
                billingId:
                  type: string
                  minLength: 1
                  examples:
                    - BILL-202611-001
                  description: ID/kode billing (Q-02, Q-09); contoh BILL-202611-001.
                ntpn:
                  type: string
                  minLength: 1
                  examples:
                    - NTPN-ABC123
                  description: Tidak wajib pada pencatatan awal (dicatat sebagai Draft/INCOMPLETE); dilengkapi lewat API-KE01-11. Wajib bersama bukti pembayaran agar CONFIRMED (Q-10); contoh NTPN-ABC123.
                eBillingFile:
                  type: string
                  format: binary
                  contentMediaType: application/pdf
                  description: Berkas PDF e-Billing (multipart/form-data).
                paymentProofFile:
                  type: string
                  format: binary
                  contentMediaType: application/pdf
                  description: Berkas PDF bukti pembayaran (multipart/form-data); tidak wajib pada pencatatan awal (Draft/INCOMPLETE), dilengkapi lewat API-KE01-11. Wajib bersama NTPN agar CONFIRMED (Q-10).
            encoding:
              eBillingFile:
                contentType: application/pdf
              paymentProofFile:
                contentType: application/pdf
      responses:
        "200":
          description: Pembayaran tersimpan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxPaymentCreatedResponse"
              examples:
                sukses:
                  value:
                    code: "200"
                    message: "Pembayaran tersimpan"
                    data:
                      taxPaymentId: "01a25dad-c900-79c2-a6e1-b45d08af7362"
                      status: INCOMPLETE
                      taxPeriod: "2026-11"
                      paymentDifference: "0.00"
        "400":
          description: "Permintaan tidak valid: field wajib kosong, angka negatif, atau lampiran bukan PDF"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                INVALID_PAYMENT:
                  summary: field wajib kosong, angka negatif, atau lampiran bukan PDF
                  value:
                    code: "400"
                    message: "Data pembayaran tidak valid"
                    data: null
                    errorCode: INVALID_PAYMENT
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "ID tidak ditemukan: masa pajak belum memiliki rekap"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                TAX_RECAP_NOT_FOUND:
                  summary: masa pajak belum memiliki rekap
                  value:
                    code: "404"
                    message: "Masa pajak belum memiliki rekap"
                    data: null
                    errorCode: TAX_RECAP_NOT_FOUND
  /api/v1/tax-recaps/{taxPeriod}/export:
    get:
      operationId: exportTaxRecap
      tags:
        - Faktur dan pembayaran
      summary: "API-KE01-09: Ekspor rekap ke Excel atau PDF"
      description: "Fitur FTR-KE01-06; dipakai UI-KE01-06 (internal). File rekap masa pajak dihasilkan dalam format Excel atau PDF; susunan kolom, isi, dan total identik dengan rekap di layar. Sumber: Backlog BL-07; Peta Aktor dan Proses E-1 (Langkah 9); jawaban mitra Q-15, Q-17."
      parameters:
        - name: taxPeriod
          in: path
          required: true
          description: Masa pajak yang sedang dilihat; contoh 2026-11.
          schema:
            $ref: "#/components/schemas/TaxPeriod"
        - name: format
          in: query
          required: true
          description: Hanya xlsx atau pdf (Q-15); CSV dan format lain ditolak 400.
          schema:
            type: string
            enum:
              - xlsx
              - pdf
      responses:
        "200":
          description: File rekap
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              description: Berkas diunduh sebagai lampiran; nama berkas rekap-pajak-<taxPeriod>.<format> (usulan).
              schema:
                type: string
                examples:
                  - attachment; filename="rekap-pajak-2026-11.xlsx"
        "400":
          description: "Permintaan tidak valid: format selain xlsx atau pdf, atau taxPeriod tidak valid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                INVALID_FORMAT:
                  summary: format selain xlsx atau pdf, atau taxPeriod tidak valid
                  value:
                    code: "400"
                    message: "Format ekspor hanya xlsx atau pdf"
                    data: null
                    errorCode: INVALID_FORMAT
                INVALID_TAX_PERIOD:
                  summary: taxPeriod bukan YYYY-MM
                  value:
                    code: "400"
                    message: "Masa pajak harus berformat YYYY-MM (contoh 2026-11)"
                    data: null
                    errorCode: INVALID_TAX_PERIOD
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/tax/summary:
    get:
      operationId: getTaxSummary
      tags:
        - Ringkasan pajak
      summary: "API-KE01-10: Ringkasan pajak per masa pajak untuk modul lain"
      description: "Fitur FTR-KE01-07; dipakai modul ERP lain, termasuk E-2. Ringkasan pajak (jumlah faktur aktif, total DPP, PPN, PPnBM, dan status pembayaran) per masa pajak untuk modul ERP lain, termasuk E-2 (arus kas dan dasbor keuangan). Sumber: Backlog BL-08; Peta Aktor dan Proses E-1 (Langkah 10); hasil minimum E-1 pada Pembagian Pekerjaan (API ringkasan pajak); jawaban mitra Q-22."
      parameters:
        - name: taxPeriod
          in: query
          required: true
          description: Masa pajak satu bulan (Q-12); contoh 2026-11.
          schema:
            $ref: "#/components/schemas/TaxPeriod"
        - name: projectId
          in: query
          required: false
          description: ID kanonis proyek milik D-1; contoh prj-demo-001. Bila dihilangkan, seluruh proyek pada masa pajak dihitung.
          schema:
            type: string
            minLength: 1
            examples:
              - prj-demo-001
      responses:
        "200":
          description: Ringkasan pajak
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxSummaryResponse"
              examples:
                sukses:
                  value:
                    code: "200"
                    message: "Ringkasan pajak"
                    data:
                      taxPeriod: "2026-11"
                      invoiceCount: 1
                      totalDpp: "100000000.00"
                      totalPpn: "11000000.00"
                      totalPpnbm: "0.00"
                      paymentStatus: CONFIRMED
        "400":
          description: "Permintaan tidak valid: taxPeriod bukan YYYY-MM; projectId tidak valid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                INVALID_TAX_PERIOD:
                  summary: taxPeriod bukan YYYY-MM
                  value:
                    code: "400"
                    message: "Masa pajak harus berformat YYYY-MM (contoh 2026-11)"
                    data: null
                    errorCode: INVALID_TAX_PERIOD
                INVALID_PROJECT_ID:
                  summary: projectId tidak valid
                  value:
                    code: "400"
                    message: "projectId tidak valid"
                    data: null
                    errorCode: INVALID_PROJECT_ID
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Pengguna sah, akses tidak cukup (konsumen atau pengguna tidak berwenang membaca ringkasan pajak)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                FORBIDDEN:
                  summary: konsumen atau pengguna tidak berwenang membaca ringkasan pajak
                  value:
                    code: "403"
                    message: "Pengguna sah, akses tidak cukup"
                    data: null
                    errorCode: FORBIDDEN
  /api/v1/tax-payments/{taxPaymentId}:
    patch:
      operationId: completeTaxPayment
      tags:
        - Faktur dan pembayaran
      summary: "API-KE01-11: Lengkapi pembayaran menjadi Terkonfirmasi"
      description: "Fitur FTR-KE01-05; dipakai UI-KE01-05 (internal). Catatan pembayaran berstatus Draft/INCOMPLETE dilengkapi menjadi Terkonfirmasi (CONFIRMED); pelengkapan hanya dapat dilakukan bila NTPN dan bukti pembayaran ada. Sumber: Backlog BL-06; Peta Aktor dan Proses E-1 (Langkah 8); jawaban mitra Q-02 (update data dari rekap), Q-10."
      parameters:
        - name: taxPaymentId
          in: path
          required: true
          description: ID catatan pembayaran; Draft dilengkapi atau bukti/NTPN catatan terkonfirmasi diperbarui. Berkas bukti lama tetap disimpan.
          schema:
            type: string
            format: uuid
            examples:
              - "01a25dad-c900-79c2-a6e1-b45d08af7362"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - ntpn
                - paymentProofFile
              properties:
                ntpn:
                  type: string
                  minLength: 1
                  examples:
                    - NTPN-ABC123
                  description: NTPN; wajib untuk melengkapi pembayaran menjadi CONFIRMED (Q-10); contoh NTPN-ABC123.
                paymentProofFile:
                  type: string
                  format: binary
                  contentMediaType: application/pdf
                  description: Berkas PDF bukti pembayaran (multipart/form-data); wajib bersama NTPN untuk CONFIRMED (Q-10). Berkas lama tidak dihapus saat diganti.
            encoding:
              paymentProofFile:
                contentType: application/pdf
      responses:
        "200":
          description: Pembayaran Terkonfirmasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxPaymentCompletedResponse"
              examples:
                sukses:
                  value:
                    code: "200"
                    message: "Pembayaran Terkonfirmasi"
                    data:
                      taxPaymentId: "01a25dad-c900-79c2-a6e1-b45d08af7362"
                      status: CONFIRMED
                      paymentStatus: CONFIRMED
        "400":
          description: "Permintaan tidak valid: ntpn atau bukti pembayaran tidak ada, atau lampiran bukan PDF"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                INVALID_PAYMENT:
                  summary: ntpn atau bukti pembayaran tidak ada, atau lampiran bukan PDF
                  value:
                    code: "400"
                    message: "NTPN dan bukti pembayaran wajib diisi untuk Terkonfirmasi"
                    data: null
                    errorCode: INVALID_PAYMENT
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "ID tidak ditemukan: taxPaymentId tidak dikenal"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                TAX_PAYMENT_NOT_FOUND:
                  summary: taxPaymentId tidak dikenal
                  value:
                    code: "404"
                    message: "Catatan pembayaran tidak ditemukan"
                    data: null
                    errorCode: TAX_PAYMENT_NOT_FOUND
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Token diterbitkan F-1 saat login dan dikirim sebagai Authorization: Bearer <token>. Layanan memeriksa tanda tangan, iss, aud, dan exp, lalu peran (kodePeran) dan izin. Pemilik kunci, masa token, dan perilaku logout ditetapkan F-1."
  responses:
    Unauthorized:
      description: Token tidak ada atau tidak sah
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            UNAUTHORIZED:
              summary: token tidak ada atau tidak sah
              value:
                code: "401"
                message: "Token tidak ada atau tidak sah"
                data: null
                errorCode: UNAUTHORIZED
    Forbidden:
      description: Pengguna sah, akses tidak cukup (peran bukan Admin, CEO, atau COO)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            FORBIDDEN:
              summary: peran bukan Admin, CEO, atau COO
              value:
                code: "403"
                message: "Pengguna sah, akses tidak cukup"
                data: null
                errorCode: FORBIDDEN
  schemas:
    Money:
      type: string
      pattern: ^[0-9]{1,16}\.[0-9]{2}$
      description: Nominal respons string decimal(18,2), titik desimal, tepat dua angka desimal, tanpa pemisah ribuan; tidak memakai float.
      examples:
        - "100000000.00"
    MoneyInput:
      type: string
      pattern: ^[0-9]{1,16}(\.[0-9]{1,2})?$
      description: Nominal pada request berupa string decimal(18,2) tanpa pemisah ribuan, misalnya 11000000.00; dinormalkan ke dua angka desimal saat disimpan.
      examples:
        - "11000000.00"
    MoneyInputNullable:
      type:
        - string
        - "null"
      pattern: ^[0-9]{1,16}(\.[0-9]{1,2})?$
      description: Nominal pada request berupa string decimal(18,2) tanpa pemisah ribuan; null bila tidak ada.
    SignedMoney:
      type: string
      pattern: ^-?[0-9]{1,16}\.[0-9]{2}$
      description: Selisih respons string decimal bertanda, titik desimal, tepat dua angka desimal; negatif bila jumlah setor kurang dari total PPN.
      examples:
        - "-500000.00"
    MoneyNullable:
      type:
        - string
        - "null"
      pattern: ^[0-9]{1,16}\.[0-9]{2}$
      description: "Nominal respons string decimal dengan titik dan dua angka desimal; null bila nilai tidak tersedia. Agregat kosong bernilai 0.00."
      examples:
        - "0.00"
    TaxPeriod:
      type: string
      pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
      description: Masa pajak satu bulan kalender, format YYYY-MM (Q-12).
      examples:
        - "2026-11"
    TaxInvoiceStatus:
      type: string
      enum:
        - NORMAL
        - REPLACEMENT
        - CANCELLED
      description: "Status faktur (Q-07). Label UI: Normal, Pengganti, Dibatalkan."
    RecapPaymentStatus:
      type: string
      enum:
        - NOT_RECORDED
        - INCOMPLETE
        - CONFIRMED
      description: "Status pembayaran per masa pajak: NOT_RECORDED belum ada pembayaran; INCOMPLETE bila sedikitnya satu catatan belum memiliki NTPN dan bukti; CONFIRMED bila seluruh catatan lengkap (Q-10). Tetap per masa pajak meskipun ringkasan difilter projectId."
    PaymentRecordStatus:
      type: string
      enum:
        - INCOMPLETE
        - CONFIRMED
      description: "Status satu catatan pembayaran (Q-10). Label UI: Draft/Belum Konfirmasi, Terkonfirmasi."
    HistoryAction:
      type: string
      enum:
        - CREATE
        - UPDATE
        - DELETE
        - STATUS_CHANGE
      description: Aksi pada riwayat perubahan faktur (ENT-KE01-05); penggunaan DELETE dan STATUS_CHANGE menunggu Q-21.
    ItemFaktur:
      type: object
      description: Rincian barang/jasa hasil ekstraksi PDF e-Faktur (ENT-KE01-02).
      required:
        - itemCode
        - itemName
        - saleReplacementAdvanceTermAmount
        - discountAmount
        - receivedAdvanceAmount
      properties:
        itemCode:
          type: string
          description: Kode barang/jasa dari PDF (Q-02).
          examples:
            - JASA-001
        itemName:
          type: string
          description: Nama barang/jasa kena pajak dari PDF (Q-02).
          examples:
            - Jasa pengembangan perangkat lunak termin 1
        saleReplacementAdvanceTermAmount:
          $ref: "#/components/schemas/Money"
          description: Harga jual/penggantian/uang muka/termin (Rp) dari PDF (Q-02).
        discountAmount:
          $ref: "#/components/schemas/Money"
          description: Potongan harga dari PDF; 0.00 bila tidak ada.
        receivedAdvanceAmount:
          $ref: "#/components/schemas/Money"
          description: Uang muka yang telah diterima dari PDF; 0.00 bila tidak ada.
    ItemFakturInput:
      type: object
