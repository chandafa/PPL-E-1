name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  integration-preflight:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring, bcmath, gd, zip, fileinfo
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Uji pemeriksaan integrasi dan path berisi spasi
        run: php vendor/bin/phpunit tests/Feature/ServiceReadinessTest.php tests/Feature/IntegrationCommandTest.php tests/Feature/IntegrationFrontendTest.php tests/Unit/IntegrationRuntimeTest.php
      - name: Periksa sintaks PowerShell pada Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($path in @('scripts/start-integration.ps1', 'scripts/integration-node.ps1')) {
            $parseTokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }

  test:
    runs-on: ubuntu-latest

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Siapkan PostgreSQL (bawaan runner)
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'postgres';"
          sudo -u postgres createdb e1_pajak_test
          sudo -u postgres createdb e1_pajak_ui_test

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring, bcmath, gd, zip, fileinfo
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Siapkan aset UI
        run: |
          npm ci
          npm run build
          npm run test:unit

      - name: Siapkan environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Jalankan pengujian (termasuk uji kontrak OpenAPI)
        run: php artisan test

      - name: Siapkan browser
        run: npx playwright install --with-deps chromium

      - name: Uji alur browser dan aksesibilitas
        run: npm run test:ui

      - name: Simpan hasil browser
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e1-browser-results
          path: test-results/
          if-no-files-found: ignore
