name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Siapkan PostgreSQL (bawaan runner)
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'postgres';"
          sudo -u postgres createdb e1_pajak_test
          sudo -u postgres createdb e1_pajak_ui_test

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring, bcmath, gd, zip, fileinfo
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Siapkan aset UI
        run: |
          npm ci
          npm run build
          npm run test:unit

      - name: Siapkan environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Jalankan pengujian (termasuk uji kontrak OpenAPI)
        run: php artisan test

      - name: Siapkan browser
        run: npx playwright install --with-deps chromium

      - name: Uji alur browser dan aksesibilitas
        run: npm run test:ui

      - name: Simpan hasil browser
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e1-browser-results
          path: test-results/
          if-no-files-found: ignore
